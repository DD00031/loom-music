# ════════════════════════════════════════════════════════════════════════════
#  loom configuration
#  Location: ~/Library/Application Support/loom/config.toml  (macOS)
#             ~/.config/loom/config.toml                     (Linux/Windows)
#
#  Edit this file to configure both the music downloader and library manager.
#  Run `loom config open` to open it in your default editor.
# ════════════════════════════════════════════════════════════════════════════


# ────────────────────────────────────────────────────────────────────────────
# Library  (music organisation, tagging, and database)
# ────────────────────────────────────────────────────────────────────────────

[library]
# Root directory where your music collection lives
directory = "~/Music"
# Path to the SQLite library database
library = ""   # set at startup
# Plugins to enable — see https://beets.readthedocs.io/en/stable/plugins/
plugins = []
# Optional extra paths to search for plugins
pluginpath = []

[library.import]
# Write MusicBrainz metadata back to the audio files after importing
write = true
# Copy files into the library directory (set copy=false + move=true to move instead)
copy = true
move = false
# Ask before applying each change (safer for first-time imports)
timid = false
# Auto-apply the best match without asking (useful for bulk imports)
quiet = false
# Log file for import operations
log = ""  # e.g. "~/.config/loom/import.log"
# What to do when a duplicate is detected: skip, keep, remove, merge, or ask
duplicate_action = "ask"

[library.paths]
# File naming templates — available variables: $albumartist, $album, $year,
# $track, $title, $artist, $disc, $mb_albumid, and more.
# See https://beets.readthedocs.io/en/stable/reference/pathformat.html
default   = "$albumartist/$album%aunique{}/$track $title"
singleton = "Singles/$artist/$title"
comp      = "Compilations/$album%aunique{}/$track $title"

[library.match]
# Threshold below which MusicBrainz match is auto-applied (lower = stricter)
strong_rec_thresh = 0.04
medium_rec_thresh = 0.25


# ────────────────────────────────────────────────────────────────────────────
# Download  (streaming service settings)
# ────────────────────────────────────────────────────────────────────────────

[download.downloads]
# Folder where downloaded tracks are saved
folder = ""   # set at startup (e.g. ~/Music/Downloads)
# Put Qobuz albums in a 'Qobuz' subfolder, Tidal in 'Tidal', etc.
source_subdirectories = false
# Place multi-disc albums in 'Disc N' subfolders
disc_subdirectories = true
# Download tracks concurrently (faster on fast connections)
concurrency = true
# Maximum simultaneous downloads (-1 for no limit)
max_connections = 6
# Maximum API requests per minute per service (-1 for no limit)
requests_per_minute = 60
# Verify SSL certificates — disable only if you encounter certificate errors
verify_ssl = true

[download.qobuz]
# Quality: 1 = 320kbps MP3, 2 = 16/44.1 FLAC, 3 = 24/≤96kHz, 4 = 24/≥96kHz
quality = 3
# Download booklet PDFs included with some albums
download_booklets = true
# Authenticate with a user token (true) or email+password (false)
use_auth_token = true
# User ID (token mode) or email address (password mode)
email_or_userid = ""
# Auth token (token mode) or MD5 hash of your password (password mode)
password_or_token = ""
# Do not change:
app_id = ""
secrets = []

[download.tidal]
# Quality: 0 = 256kbps AAC, 1 = 320kbps AAC, 2 = 16/44.1 FLAC, 3 = 24/44.1 MQA
quality = 3
# Download videos included in Video Albums
download_videos = true
# Do not change the fields below — they are managed by `loom` automatically:
user_id = ""
country_code = ""
access_token = ""
refresh_token = ""
# Unix timestamp of token expiry (tokens last ~1 week after refresh)
token_expiry = ""

[download.deezer]
# Quality: 0 = MP3 128, 1 = MP3 320, 2 = FLAC
# Note: only applies to paid Deezer accounts; deezloader is limited to quality 1
quality = 2
# Fall back to the best available quality if the target is not available
lower_quality_if_not_available = true
# ARL authentication cookie from your Deezer account (see docs for how to find it)
# When an ARL is provided, deezloader is never used
arl = ""
# Use deezloader for free 320kbps MP3 downloads (only when no ARL is set)
use_deezloader = true
# Warn when falling back to deezloader
deezloader_warnings = true

[download.soundcloud]
# Only quality 0 (best available) is supported at this time
quality = 0
# These are updated automatically — do not change manually:
client_id = ""
app_version = ""

[download.youtube]
# Only quality 0 (best available) is supported at this time
quality = 0
# Download the video alongside the audio
download_videos = false
# Directory for downloaded videos
video_downloads_folder = ""  # set at startup

[download.database]
# Track all downloaded item IDs so that re-downloading is skipped automatically
# Use `loom -ndb url …` to bypass this for a single command
downloads_enabled = true
downloads_path = ""   # set at startup
# Store failed download IDs so they can be retried with `loom repair`
failed_downloads_enabled = true
failed_downloads_path = ""   # set at startup

[download.conversion]
# Convert downloaded files to a different codec after downloading
enabled = false
# Target codec: FLAC, ALAC, OPUS, MP3, VORBIS, or AAC
codec = "ALAC"
# Downsample to this rate (Hz) if the source is higher — 48000 is recommended
sampling_rate = 48000
# Reduce bit depth to this value if the source is higher (16 or 24)
bit_depth = 24
# Target bitrate for lossy codecs (kbps)
lossy_bitrate = 320

[download.qobuz_filters]
# Set any of these to true to exclude matching albums from artist discography downloads
extras = false          # live recordings, collectors editions, etc.
repeats = false         # picks highest quality when multiple editions have the same title
non_albums = false      # EPs and singles
features = false        # albums where this artist is a featured guest
non_studio_albums = false
non_remaster = false

[download.artwork]
# Embed cover art into the audio file
embed = true
# Size of embedded art: thumbnail, small, large, or original
# "original" can be up to 30MB and may fail — "large" is recommended
embed_size = "large"
# Resize embedded art to this max dimension in pixels (-1 = no limit)
embed_max_width = -1
# Also save the cover as a separate JPEG file alongside the audio files
save_artwork = true
# Resize saved art to this max dimension in pixels (-1 = no limit)
saved_max_width = -1

[download.metadata]
# Set the ALBUM tag to the playlist name for playlist downloads
# Useful if your player groups tracks by album
set_playlist_to_album = true
# Number tracks sequentially within the playlist instead of using album track numbers
renumber_playlist_tracks = true
# Tags to exclude — see documentation for available tag names
exclude = []

[download.filepaths]
# Wrap single tracks in a folder using the folder_format template
add_singles_to_folder = false
# Folder naming template — available: albumartist, title, year, container,
# bit_depth, sampling_rate, id, albumcomposer
folder_format = "{albumartist} - {title} ({year}) [{container}] [{bit_depth}B-{sampling_rate}kHz]"
# File naming template — available: id, tracknumber, artist, albumartist,
# composer, title, albumcomposer, explicit
track_format = "{tracknumber:02}. {artist} - {title}{explicit}"
# Restrict filenames to printable ASCII characters
restrict_characters = false
# Truncate filenames longer than this (characters). Set high if your filesystem allows it.
truncate_to = 120

[download.lastfm]
# Download source to search when resolving Last.fm playlist tracks
source = "qobuz"
# Fallback source if no results found on the primary
fallback_source = ""

[download.spotify]
# Spotify Developer App credentials — create one at https://developer.spotify.com/dashboard
# Not required for URL downloads (those use embed scraping); only needed for API-based lookups
client_id = ""
client_secret = ""
# Download source to search when resolving Spotify tracks
source = "qobuz"
# Fallback source if no results found on the primary
fallback_source = ""

[download.cli]
# Print status lines like "Downloading Album Name …"
text_output = true
# Show progress bars during download and resolve phases
progress_bars = true
# Maximum number of results shown in the interactive search menu
max_search_results = 100

[download.misc]
# Internal version marker — do not change
version = "2.2.0"
# Notify when a new version of loom is available
check_for_updates = true
