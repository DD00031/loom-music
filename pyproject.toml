[tool.poetry]
name        = "loom"
version     = "0.1.0"
description = "Download, tag, and manage your music library — all in one tool."
authors     = []
license     = "GPL-3.0-only"
readme      = "README.md"
packages    = [{ include = "loom" }]

[tool.poetry.scripts]
loom = "loom.cli:loom"

# ── Runtime dependencies ───────────────────────────────────────────────────────
# (Merged from streamrip 2.2.0 and beets 2.8.0)

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# ── CLI / display ──────────────────────────────────────────────────────────────
click             = ">=8.1"
click-help-colors = ">=0.9.2"
rich              = ">=13.0"

# ── Download engine (was streamrip) ───────────────────────────────────────────
mutagen          = ">=1.45.1"
tomlkit          = ">=0.7.2"
pathvalidate     = ">=2.4.1"
Pillow           = ">=9"
deezer-py        = "1.3.6"
pycryptodomex    = ">=3.10.1"
appdirs          = ">=1.4.4"
m3u8             = ">=0.9.0"
aiofiles         = ">=0.7"
aiohttp          = ">=3.9"
aiodns           = ">=3.0.0"
aiolimiter       = ">=1.1.0"
simple-term-menu = { version = ">=1.2.1", markers = "sys_platform == 'darwin' or sys_platform == 'linux'" }
pick             = { version = ">=2",     markers = "sys_platform == 'win32' or sys_platform == 'cygwin'" }
windows-curses   = { version = ">=2.2.0", markers = "sys_platform == 'win32' or sys_platform == 'cygwin'" }
certifi          = { version = ">=2025.1.31", optional = true }

# ── Library manager (was beets) ───────────────────────────────────────────────
colorama         = { version = "*", markers = "sys_platform == 'win32'" }
confuse          = ">=2.2.0"
jellyfish        = "*"
lap              = ">=0.5.12"
mediafile        = ">=0.12.0"
numpy            = [
    { python = "<3.13",  version = ">=2.0.2" },
    { python = ">=3.13", version = ">=2.3.4" },
]
packaging        = ">=24.0"
platformdirs     = ">=3.5.0"
pyyaml           = "*"
requests         = ">=2.32.5"
requests-ratelimiter = ">=0.7.0"
typing_extensions = "*"
unidecode        = ">=1.3.6"

# ── Optional library extras ────────────────────────────────────────────────────
beautifulsoup4        = { version = "*",          optional = true }
dbus-python           = { version = "*",          optional = true }
flask                 = { version = "*",          optional = true }
flask-cors            = { version = "*",          optional = true }
langdetect            = { version = "*",          optional = true }
librosa               = { version = ">=0.11",     optional = true }
scipy                 = [
    { python = "<3.13",  version = ">=1.13.1",  optional = true },
    { python = ">=3.13", version = ">=1.16.1",  optional = true },
]
numba                 = [
    { python = "<3.13",  version = ">=0.60",    optional = true },
    { python = ">=3.13", version = ">=0.62.1",  optional = true },
]
py7zr                 = { version = "*",          optional = true }
pyacoustid            = { version = "*",          optional = true }
PyGObject             = { version = "*",          optional = true }
pylast                = { version = "*",          optional = true }
python-mpd2           = { version = ">=0.4.2",    optional = true }
python3-discogs-client = { version = ">=2.3.15",  optional = true }
pyxdg                 = { version = "*",          optional = true }
rarfile               = { version = "*",          optional = true }
reflink               = { version = "*",          optional = true }
resampy               = { version = ">=0.4.3",    optional = true }
requests-oauthlib     = { version = ">=0.6.1",    optional = true }
soco                  = { version = "*",          optional = true }
titlecase             = { version = "^2.4.1",     optional = true }

[tool.poetry.extras]
ssl        = ["certifi"]
chroma     = ["pyacoustid"]
discogs    = ["python3-discogs-client"]
fetchart   = ["beautifulsoup4", "langdetect", "Pillow", "requests"]
import-ex  = ["py7zr", "rarfile"]
lastgenre  = ["pylast"]
lyrics     = ["beautifulsoup4", "langdetect", "requests"]
web        = ["flask", "flask-cors"]
autobpm    = ["librosa", "resampy"]
scrub      = ["mutagen"]

[build-system]
requires      = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length    = 88

[tool.ruff.lint]
select  = ["E4", "E7", "E9", "F", "I"]
ignore  = []
fixable = ["ALL"]
